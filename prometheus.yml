global:
  scrape_interval:     15s # By default, scrape targets every 15 seconds.

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: 'indexers-prom'

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:  
  - job_name: 'sei_indexer'
    scrape_interval: 5s
    static_configs:
      - targets: ['sei-indexer-copy.railway.internal']

  - job_name: 'sei_indexer_api'
    scrape_interval: 5s
    static_configs:
      - targets: ['mgv-data.railway.internal']

  - job_name: 'base_indexer'
    scrape_interval: 5s
    static_configs:
      - targets: ['base-indexer.railway.internal']

  - job_name: 'arbitrum_indexer'
    scrape_interval: 5s
    static_configs:
      - targets: ['mgv-data-9b9cb9b4.railway.internal']

